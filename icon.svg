<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b3a"/>
      <stop offset="1" stop-color="#05020d"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff9ff"/>
      <stop offset="1" stop-color="#ff3ec8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="#ff3ec8" stroke-opacity="0.55" stroke-width="6"/>
  <!-- grapple rope from the hook down to the disc -->
  <path d="M164 82 L118 150" stroke="#ffe066" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
  <!-- grappling hook: shank + three curved prongs -->
  <g transform="translate(-22 22)" fill="none" stroke="#ffe066" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 60 L214 32"/>
    <path d="M214 32 C228 34 236 46 232 60"/>
    <path d="M214 32 C212 18 200 10 186 14"/>
    <path d="M214 32 L232 20"/>
  </g>
  <!-- the disc, tilted -->
  <g transform="rotate(-18 112 160)">
    <ellipse cx="112" cy="166" rx="74" ry="28" fill="#1a0b3a" opacity="0.6"/>
    <ellipse cx="112" cy="158" rx="74" ry="28" fill="url(#disc)"/>
    <ellipse cx="112" cy="154" rx="52" ry="17" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="5"/>
    <path d="M52 150 Q80 132 128 132" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- speed lines -->
  <g stroke="#7ff9ff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M30 120 L62 112"/>
    <path d="M26 150 L48 145"/>
    <path d="M40 186 L62 180"/>
  </g>
</svg>
